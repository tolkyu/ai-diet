version: "3.9"

services:
  api:
    image: ${DOCKER_IMAGE:-ai-diet-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  worker:
    image: ${DOCKER_IMAGE:-ai-diet-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  beat:
    image: ${DOCKER_IMAGE:-ai-diet-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    command: celery -A app.workers.celery_app beat --loglevel=warning
    deploy:
      replicas: 1

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
